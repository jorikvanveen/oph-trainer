[package]
name = "oph-trainer-backend"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "migration"]
resolver = "3"

[dependencies]
axum = "0.8.9"
hex = "0.4.3"
migration = { path = "migration" }
rand = "0.9.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0.151"
sea-orm = { version = "2.0.1", default-features = false, features = ["macros", "sqlx-sqlite", "runtime-tokio-rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6.11", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = "12.0.1"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
