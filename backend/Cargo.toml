[package]
name = "oph-trainer-backend"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "migration"]
resolver = "3"

[dependencies]
axum = "0.8.9"
migration = { path = "migration" }
sea-orm = { version = "2.0.1", default-features = false, features = ["macros", "sqlx-sqlite", "runtime-tokio-rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = "12.0.1"
